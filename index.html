<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Will You Be My Valentine ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(-45deg,
#1b0028,
#4a0f6b,
#7b1fa2,
#ff4d88);

background-size:400% 400%;

animation:bgMove 12s ease infinite;

}

@keyframes bgMove{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

.card{

width:90%;
max-width:420px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(18px);

border-radius:25px;

padding:35px;

text-align:center;

box-shadow:0 0 35px rgba(255,255,255,.15);

animation:fade 1.2s;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

h1{

font-size:38px;

color:white;

margin-bottom:20px;

text-shadow:0 0 20px hotpink;

animation:beat 1s infinite;

}

@keyframes beat{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.08);

}

}

p{

color:white;

font-size:18px;

line-height:30px;

margin-bottom:30px;

}

button{

border:none;

padding:16px 28px;

border-radius:40px;

font-size:18px;

cursor:pointer;

transition:.35s;

margin:10px;

font-weight:bold;

}

.yes{

background:#ff2e75;

color:white;

box-shadow:0 0 25px hotpink;

}

.yes:hover{

transform:scale(1.08);

}

.no{

background:white;

color:#ff2e75;

}

.no:hover{

transform:scale(1.08);

}

.back{

background:#ffd54f;

color:#222;

}

.flowers{

position:absolute;

left:0;

top:0;

width:100%;

height:100%;

pointer-events:none;

overflow:hidden;

}

.flower{

position:absolute;

font-size:30px;

animation:fall linear forwards;

}

@keyframes fall{

0%{

transform:translateY(-100px) rotate(0deg);

opacity:1;

}

100%{

transform:translateY(110vh) rotate(720deg);

opacity:0;

}

}

</style>

</head>

<body>

<div class="flowers" id="flowers"></div>

<div class="card" id="card">

<h1>❤️</h1>

<p>

Will You Be My Valentine?

</p>

<button class="yes" onclick="yesClick()">

YES ❤️

</button>

<button class="no" onclick="noClick()">

NO 💔

</button>

</div>

<script>// ===== FUNCTIONS =====

const card = document.getElementById("card");
const flowers = document.getElementById("flowers");

// 🌸 Flower Rain
function createFlower(){

    const flower=document.createElement("div");

    flower.className="flower";

    const emojis=["🌹","🌸","🌺","💐","🌷","❤️"];

    flower.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

    flower.style.left=Math.random()*100+"vw";

    flower.style.animationDuration=(3+Math.random()*3)+"s";

    flower.style.fontSize=(22+Math.random()*18)+"px";

    flowers.appendChild(flower);

    setTimeout(()=>{
        flower.remove();
    },6000);

}

// ❤️ YES CLICK
function yesClick(){

    for(let i=0;i<250;i++){

        setTimeout(createFlower,i*18);

    }

    document.body.style.animation="bgMove 5s ease infinite";

    setTimeout(showSuccess,1200);

}

// 💔 NO CLICK
function noClick(){

card.innerHTML=`

<h1>🥺</h1>

<p style="font-size:24px">

Ab tum fas gayi ho beta... 😏❤️

<br><br>

Aise bhaag nahi sakti.

</p>

<button class="back"

onclick="goBack()">

⬅️ Back

</button>

`;

}

// 🔙 BACK
function goBack(){

card.innerHTML=`

<h1>❤️</h1>

<p>

Will You Be My Valentine?

</p>

<button class="yes"

onclick="yesClick()">

YES ❤️

</button>

<button class="no"

onclick="noClick()">

NO 💔

</button>

`;

}

// 🎉 SUCCESS SCREEN
function showSuccess(){

card.innerHTML=`

<h1 style="font-size:52px">

❤️

</h1>

<p style="font-size:24px">

Mujhe pehle se hi pata tha...

❤️🥹

<br><br>

I knew you'd say YES!

</p>

<button class="yes"

onclick="moreLove()">

Forever Together ❤️

</button>

`;

}// ❤️ FOREVER TOGETHER

function moreLove(){

    // aur flowers
    for(let i=0;i<400;i++){

        setTimeout(createFlower,i*12);

    }

    // background glow
    document.body.style.transition="1s";

    document.body.style.background=
    "linear-gradient(135deg,#ff4d88,#ff80ab,#ff1744,#d500f9)";

    // Final Screen
    card.innerHTML=`

    <h1 id="loveText">

    I LOVE YOU ❤️

    </h1>

    <p class="finalText">


    <br><br>

    Mujhe pehle se hi pata tha...

    ki tum YES hi bologi. 🥹❤️

    <br><br>

    Thank you for making my life beautiful.

    <br><br>

    Forever Yours,

    <br>

    <b>Ambuj ❤️</b>

    </p>

    `;

    // Continuous flowers
    setInterval(createFlower,120);

}

// END SCRIPT
</script>

<style>

/* Final Love Text */

#loveText{

font-size:65px;

color:white;

text-shadow:

0 0 15px hotpink,

0 0 40px deeppink,

0 0 70px #ff2e75;

animation:

heartbeat 1s infinite,

glow 2s infinite alternate;

margin-bottom:25px;

}

/* Heart Beat */

@keyframes heartbeat{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.12);

}

}

/* Glow */

@keyframes glow{

from{

text-shadow:

0 0 20px hotpink,

0 0 50px deeppink;

}

to{

text-shadow:

0 0 40px white,

0 0 80px hotpink,

0 0 120px deeppink;

}

}

/* Final Paragraph */

.finalText{

font-size:22px;

line-height:40px;

color:white;

animation:fadeIn 2s;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(25px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</body>
</html>
